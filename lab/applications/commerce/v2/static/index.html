<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRACE Store - Version B</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- Navigation Header (NONREG-001: Visual redesign with purple gradient and emoji) -->
  <header class="border-b border-purple-900/50 bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="h-8 w-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20">R</span>
        <span class="font-bold text-lg text-white">RETRACE Store 🛍️ (v2.0.0)</span>
      </a>
      <div class="flex items-center gap-6">
        <div class="relative">
          <input
            id="search-input"
            type="text"
            placeholder="Search products..."
            class="bg-slate-800 text-sm rounded-lg px-4 py-1.5 border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 w-64"
          >
        </div>
        <a id="cart-nav-link" href="/cart.html" class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium transition">
          <span>🛒 Cart</span>
          <span id="cart-badge" class="px-2 py-0.5 rounded-full bg-purple-600 text-xs text-white font-bold">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Catalog Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-white">Explore Our Catalog</h1>
      <p class="text-sm text-slate-400 mt-1">High quality developer hardware, accessories, and tools</p>
    </div>

    <!-- Category Filters -->
    <div class="flex items-center gap-2 mb-6" id="category-filters">
      <button data-cat="" class="cat-btn px-3.5 py-1 rounded-full text-xs font-semibold bg-purple-600 text-white">All</button>
      <button data-cat="Laptops" class="cat-btn px-3.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white">Laptops</button>
      <button data-cat="Audio" class="cat-btn px-3.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white">Audio</button>
      <button data-cat="Accessories" class="cat-btn px-3.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white">Accessories</button>
      <button data-cat="Displays" class="cat-btn px-3.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white">Displays</button>
    </div>

    <!-- Products Grid -->
    <div id="products-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
