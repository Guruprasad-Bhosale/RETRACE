<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart - RETRACE Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-white">R</span>
        <span class="font-bold text-lg text-white">RETRACE Store (v1.0.0)</span>
      </a>
      <a href="/" class="text-sm font-medium text-slate-400 hover:text-white">← Continue Shopping</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-bold tracking-tight text-white mb-6">Shopping Cart</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Cart Items List -->
      <div class="md:col-span-2 space-y-4" id="cart-items-container">
        <!-- Cart items rendered here -->
      </div>

      <!-- Order Summary Card -->
      <div class="p-6 rounded-xl bg-slate-800/80 border border-slate-700 h-fit space-y-4">
        <h2 class="text-base font-semibold text-white border-b border-slate-700 pb-3">Order Summary</h2>

        <!-- Coupon Input -->
        <div class="space-y-2">
          <label for="coupon-code-input" class="block text-xs font-medium text-slate-400">Promotional Coupon</label>
          <div class="flex gap-2">
            <input
              id="coupon-code-input"
              type="text"
              placeholder="e.g. SAVE20"
              class="w-full bg-slate-900 text-sm rounded-lg px-3 py-1.5 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 uppercase"
            >
            <button
              id="apply-coupon-btn"
              class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition"
            >
              Apply
            </button>
          </div>
          <div id="coupon-message" class="text-xs"></div>
        </div>

        <!-- Price Breakdown -->
        <div class="space-y-2 pt-3 border-t border-slate-700 text-sm">
          <div class="flex justify-between text-slate-400">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div id="discount-row" class="flex justify-between text-emerald-400 hidden">
            <span>Discount</span>
            <span id="summary-discount">-$0.00</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>Estimated Tax (10%)</span>
            <span id="summary-tax">$0.00</span>
          </div>
          <div class="flex justify-between text-base font-bold text-white pt-2 border-t border-slate-700">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>
        </div>

        <!-- Checkout Navigation Link -->
        <a
          id="proceed-checkout-btn"
          href="/checkout.html"
          class="block w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-center text-white text-sm font-semibold transition shadow-md shadow-emerald-600/20"
        >
          Proceed to Checkout →
        </a>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
