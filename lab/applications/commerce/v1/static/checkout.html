<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - RETRACE Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-white">R</span>
        <span class="font-bold text-lg text-white">RETRACE Store (v1.0.0)</span>
      </a>
      <a href="/cart.html" class="text-sm font-medium text-slate-400 hover:text-white">← Return to Cart</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-bold tracking-tight text-white mb-6">Complete Your Order</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Checkout Form -->
      <form id="checkout-form" class="md:col-span-2 space-y-4 bg-slate-800/80 p-6 rounded-xl border border-slate-700">
        <h2 class="text-base font-semibold text-white mb-4">Shipping & Payment Details</h2>

        <div>
          <label for="customer-name" class="block text-xs font-semibold text-slate-300 mb-1">Full Name *</label>
          <input
            id="customer-name"
            name="customer_name"
            type="text"
            required
            aria-required="true"
            placeholder="Alex Chen"
            class="w-full bg-slate-900 text-sm rounded-lg px-3.5 py-2 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
          >
        </div>

        <div>
          <label for="customer-email" class="block text-xs font-semibold text-slate-300 mb-1">Email Address *</label>
          <input
            id="customer-email"
            name="customer_email"
            type="email"
            required
            aria-required="true"
            placeholder="alex.chen@example.com"
            class="w-full bg-slate-900 text-sm rounded-lg px-3.5 py-2 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
          >
        </div>

        <div>
          <label for="shipping-address" class="block text-xs font-semibold text-slate-300 mb-1">Shipping Address *</label>
          <input
            id="shipping-address"
            name="shipping_address"
            type="text"
            required
            aria-required="true"
            placeholder="123 Tech Way, San Francisco, CA 94107"
            class="w-full bg-slate-900 text-sm rounded-lg px-3.5 py-2 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
          >
        </div>

        <div>
          <label for="payment-method" class="block text-xs font-semibold text-slate-300 mb-1">Payment Method *</label>
          <select
            id="payment-method"
            name="payment_method"
            required
            class="w-full bg-slate-900 text-sm rounded-lg px-3.5 py-2 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"
          >
            <option value="credit_card">Credit Card (Simulated)</option>
            <option value="paypal">PayPal</option>
            <option value="apple_pay">Apple Pay</option>
          </select>
        </div>

        <button
          type="submit"
          id="place-order-btn"
          class="w-full mt-4 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition shadow-md shadow-indigo-600/20"
        >
          Place Order
        </button>
      </form>

      <!-- Order Review Sidebar -->
      <div class="p-6 rounded-xl bg-slate-800/80 border border-slate-700 h-fit space-y-4">
        <h2 class="text-base font-semibold text-white border-b border-slate-700 pb-3">Cart Summary</h2>
        <div id="checkout-items-list" class="space-y-2 text-xs text-slate-300 max-h-48 overflow-y-auto"></div>
        <div class="space-y-1.5 pt-3 border-t border-slate-700 text-xs">
          <div class="flex justify-between text-slate-400"><span>Subtotal:</span><span id="checkout-subtotal">$0.00</span></div>
          <div id="checkout-discount-row" class="flex justify-between text-emerald-400 hidden"><span>Discount:</span><span id="checkout-discount">-$0.00</span></div>
          <div class="flex justify-between text-slate-400"><span>Tax (10%):</span><span id="checkout-tax">$0.00</span></div>
          <div class="flex justify-between text-sm font-bold text-white pt-2 border-t border-slate-700"><span>Total:</span><span id="checkout-total">$0.00</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
