name: RETRACE Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Quality, Tests & Security Audit
  # ----------------------------------------------------------------------------
  backend-quality:
    name: Backend Lint, Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ruff Code Quality Linter
        run: ruff check .

      - name: Security & Secret Scanner Audit
        run: python -m packages.security.audit

      - name: Production Configuration Pre-flight Validation
        run: python -m packages.config.validator

      - name: Run Backend Pytest Suite
        run: pytest -v

      - name: Verify Oracle Isolation Boundary
        run: pytest tests/evaluation/test_oracle_isolation.py tests/integration/evaluation/test_ground_truth_boundary.py -v

  # ----------------------------------------------------------------------------
  # 2. Frontend Quality, Unit Tests & Production Build
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run Frontend Tests (Headless)
        working-directory: apps/frontend
        run: npm test -- --watch=false

      - name: Build Production Angular Bundle
        working-directory: apps/frontend
        run: npm run build -- --configuration=production

  # ----------------------------------------------------------------------------
  # 3. Docker Container Image Builds
  # ----------------------------------------------------------------------------
  container-build:
    name: Container Build & Verification
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: retrace-api:${{ github.sha }}

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: false
          tags: retrace-worker:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: false
          tags: retrace-frontend:${{ github.sha }}
